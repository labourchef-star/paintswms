# $0 hosting: free web service + free Render Postgres. (Free Postgres expires after 30 days on Render unless upgraded; free web sleeps when idle.)
services:
  - type: web
    name: paintswms-app
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paintswms-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: GUMROAD_PRODUCT_IDS
        value: "u2Tu8n-yyl4toTk914y6jA==,dH-NHPOh2YK74-gz4J8DwA=="
      - key: GUMROAD_PACK_ID
        value: "u2Tu8n-yyl4toTk914y6jA=="
      - key: GUMROAD_ACCESS_TOKEN   # optional: enables /unlock/return?sale_id= verification
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
databases:
  - name: paintswms-db
    plan: free
    databaseName: paintswms
    user: paintswms
